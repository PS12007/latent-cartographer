name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install numpy matplotlib pytest
      - run: pytest -q tests
      - run: node tests/js_parity.mjs
